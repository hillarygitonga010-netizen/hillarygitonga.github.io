<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Hillary Gitonga</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Quick styling for projects page */
    .projects-container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
    .project { padding: 15px; border: 1px solid #ddd; border-radius: 8px; background-color: #f8f8f8; }
    .project h3 { margin: 0 0 5px 0; }
    .project-date { font-size: 0.9em; color: #666; }
    .project-description { margin: 5px 0; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html" class="active">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- PROJECTS SECTION -->
  <section id="projects" class="section">
    <h2>Projects</h2>

    <!-- Projects container -->
    <div class="projects-container" id="projects-container">
      <!-- No projects initially -->
    </div>

    <hr>

    <!-- Add new project form -->
    <div id="add-project-form" style="margin-top:30px;">
      <h3>Add New Project</h3>
      <label>Project Name: <input type="text" id="proj-name"></label><br><br>
      <label>Date Completed: <input type="text" id="proj-date"></label><br><br>
      <label>Description:<br>
        <textarea id="proj-desc" rows="4" cols="50"></textarea>
      </label><br><br>
      <label>Live Project Link: <input type="text" id="proj-link"></label><br><br>
      <button onclick="addProject()">Add Project</button>
    </div>

  </section>

  <script>
    // Clear old projects from previous versions
    localStorage.removeItem('projects');

    // Load projects from localStorage when page loads
    document.addEventListener('DOMContentLoaded', () => {
      const storedProjects = JSON.parse(localStorage.getItem('projects')) || [];
      storedProjects.forEach(proj => displayProject(proj));
    });

    // Function to display a project
    function displayProject(proj) {
      const container = document.getElementById('projects-container');
      const projectDiv = document.createElement('div');
      projectDiv.className = 'project';
      projectDiv.innerHTML = `
        <h3>${proj.name}</h3>
        <p class="project-date">Completed: ${proj.date}</p>
        <p class="project-description">${proj.desc}</p>
        <p><a href="${proj.link}" target="_blank" rel="noopener noreferrer">Visit Live Project</a></p>
      `;
      container.appendChild(projectDiv);
    }

    // Function to add a new project
    function addProject() {
      const name = document.getElementById('proj-name').value.trim();
      const date = document.getElementById('proj-date').value.trim();
      const desc = document.getElementById('proj-desc').value.trim();
      const link = document.getElementById('proj-link').value.trim();

      if (!name || !date || !desc || !link) {
        alert("Please fill all fields!");
        return;
      }

      const newProject = { name, date, desc, link };

      // Save to localStorage
      const projects = JSON.parse(localStorage.getItem('projects')) || [];
      projects.push(newProject);
      localStorage.setItem('projects', JSON.stringify(projects));

      // Display immediately
      displayProject(newProject);

      // Clear form fields
      document.getElementById('proj-name').value = '';
      document.getElementById('proj-date').value = '';
      document.getElementById('proj-desc').value = '';
      document.getElementById('proj-link').value = '';
    }
  </script>

</body>
</html>
