<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h2, h3 {
      margin-bottom: 10px;
    }

    .projects {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .project {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 6px;
      background: #f9f9f9;
    }

    .project h4 {
      margin: 0 0 5px;
    }

    form {
      margin-top: 30px;
      max-width: 500px;
    }

    input, textarea, button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      font-size: 14px;
    }

    button {
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>My Projects</h2>

  <!-- PART 1: DISPLAY AREA -->
  <div id="projects" class="projects"></div>

  <!-- PART 2: ADD PROJECT FORM -->
  <h3>Add Project</h3>
  <form id="projectForm">
    <input type="text" id="title" placeholder="Project Title" required>
    <textarea id="description" placeholder="Project Description" required></textarea>
    <input type="url" id="link" placeholder="Project Link (https://...)" required>
    <button type="submit">Add Project</button>
  </form>

  <!-- PART 3: LOGIC -->
  <script>
    const projectsDiv = document.getElementById("projects");
    const form = document.getElementById("projectForm");

    // Load saved projects (NO deletion, NO clearing)
    const savedProjects = JSON.parse(localStorage.getItem("projects")) || [];
    savedProjects.forEach(showProject);

    // Add project (ONLY ADD)
    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const project = {
        title: title.value.trim(),
        description: description.value.trim(),
        link: link.value.trim()
      };

      savedProjects.push(project);
      localStorage.setItem("projects", JSON.stringify(savedProjects));
      showProject(project);

      form.reset();
    });

    function showProject(project) {
      const div = document.createElement("div");
      div.className = "project";

      div.innerHTML = `
        <h4>${project.title}</h4>
        <p>${project.description}</p>
        <a href="${project.link}" target="_blank">${project.link}</a>
      `;

      projectsDiv.appendChild(div);
    }
  </script>

</body>
</html>
