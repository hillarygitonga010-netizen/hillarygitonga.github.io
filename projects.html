<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Hillary Gitonga</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Quick styling for the dynamic projects page */
    .projects-container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
    .project { padding: 15px; border: 1px solid #ddd; border-radius: 8px; background-color: #f8f8f8; }
    .project h3 { margin: 0 0 5px 0; }
    .project-date { font-size: 0.9em; color: #666; }
    .project-description { margin: 5px 0; }
    .project img { max-width: 100%; border-radius: 5px; margin-top: 10px; }
    #drop-zone { padding: 15px; border: 2px dashed #999; border-radius: 8px; margin-top: 10px; text-align: center; color: #666; cursor: pointer; }
    #drop-zone.hover { border-color: #333; color: #333; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html" class="active">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- PROJECTS SECTION -->
  <section id="projects" class="section">
    <h2>Projects</h2>

    <!-- Projects container -->
    <div class="projects-container" id="projects-container">
      <!-- No projects initially -->
    </div>

    <hr>

    <!-- Add new project form -->
    <div id="add-project-form" style="margin-top:30px;">
      <h3>Add New Project</h3>
      <label>Project Name: <input type="text" id="proj-name"></label><br><br>
      <label>Date Completed: <input type="text" id="proj-date"></label><br><br>
      <label>Description:<br>
        <textarea id="proj-desc" rows="4" cols="50"></textarea>
      </label><br><br>
      <label>Live Project Link: <input type="text" id="proj-link"></label><br><br>

      <!-- Drag & drop for image -->
      <div id="drop-zone">Drag & Drop Project Image Here (optional)</div>
      <input type="file" id="proj-image" accept="image/*" style="display:none;"><br><br>

      <button onclick="addProject()">Add Project</button>
    </div>

  </section>

  <script>
    // Load projects from localStorage
    document.addEventListener('DOMContentLoaded', () => {
      const storedProjects = JSON.parse(localStorage.getItem('projects')) || [];
      storedProjects.forEach(proj => displayProject(proj));
    });

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('proj-image');
    let uploadedImage = null;

    // Click to select image
    dropZone.addEventListener('click', () => fileInput.click());

    // Handle file selection
    fileInput.addEventListener('change', e => {
      uploadedImage = e.target.files[0];
      dropZone.textContent = uploadedImage.name;
    });

    // Drag & drop
    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('hover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('hover');
      uploadedImage = e.dataTransfer.files[0];
      dropZone.textContent = uploadedImage.name;
    });

    // Function to display a project
    function displayProject(proj) {
      const container = document.getElementById('projects-container');
      const projectDiv = document.createElement('div');
      projectDiv.className = 'project';
      projectDiv.innerHTML = `
        <h3>${proj.name}</h3>
        <p class="project-date">Completed: ${proj.date}</p>
        <p class="project-description">${proj.desc}</p>
        ${proj.image ? `<img src="${proj.image}" alt="Project Screenshot">` : ''}
        <p><a href="${proj.link}" target="_blank" rel="noopener noreferrer">Visit Live Project</a></p>
      `;
      container.appendChild(projectDiv);
    }

    // Add new project function
    function addProject() {
      const name = document.getElementById('proj-name').value.trim();
      const date = document.getElementById('proj-date').value.trim();
      const desc = document.getElementById('proj-desc').value.trim();
      const link = document.getElementById('proj-link').value.trim();

      if (!name || !date || !desc || !link) {
        alert("Please fill all fields!");
        return;
      }

      // Handle image as base64 if uploaded
      if (uploadedImage) {
        const reader = new FileReader();
        reader.onload = function(event) {
          saveProject({ name, date, desc, link, image: event.target.result });
        };
        reader.readAsDataURL(uploadedImage);
      } else {
        saveProject({ name, date, desc, link, image: null });
      }

      // Reset form
      document.getElementById('proj-name').value = '';
      document.getElementById('proj-date').value = '';
      document.getElementById('proj-desc').value = '';
      document.getElementById('proj-link').value = '';
      uploadedImage = null;
      dropZone.textContent = 'Drag & Drop Project Image Here (optional)';
    }

    // Save project to localStorage and display
    function saveProject(proj) {
      const projects = JSON.parse(localStorage.getItem('projects')) || [];
      projects.push(proj);
      localStorage.setItem('projects', JSON.stringify(projects));
      displayProject(proj);
    }
  </script>

</body>
</html>
