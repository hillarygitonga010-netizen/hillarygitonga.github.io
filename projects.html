<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Hillary Gitonga</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h2, h3 { margin-bottom: 10px; }
    .projects { margin-top: 20px; display: flex; flex-direction: column; gap: 15px; }
    .project { border: 1px solid #ccc; padding: 15px; border-radius: 6px; background: #f9f9f9; }
    .project h4 { margin: 0 0 5px; }
    form { margin-top: 30px; max-width: 500px; }
    input, textarea, button { width: 100%; margin-top: 8px; padding: 8px; font-size: 14px; }
    button { font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <h2>My Projects</h2>

  <!-- Display Area -->
  <div id="projects" class="projects"></div>

  <!-- Add Project Form -->
  <h3>Add Project</h3>
  <form id="projectForm">
    <input type="text" id="title" placeholder="Project Title" required>
    <textarea id="description" placeholder="Project Description" required></textarea>
    <input type="url" id="link" placeholder="Project Link (https://...)" required>
    <button type="submit">Add Project</button>
  </form>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // 🔹 THIS IS YOUR FIREBASE CONFIG — DO NOT CHANGE ANYTHING BELOW
    const firebaseConfig = {
      apiKey: "AIzaSyDLdMe1EYQaqXup8hlzR5MG2pJ9qThsfzw",
      authDomain: "comrade-project.firebaseapp.com",
      projectId: "comrade-project",
      storageBucket: "comrade-project.firebasestorage.app",
      messagingSenderId: "896481693071",
      appId: "1:896481693071:web:8ca5bb457877fe12a40ffa",
      measurementId: "G-1M2FWCMVN0"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const form = document.getElementById("projectForm");
    const projectsDiv = document.getElementById("projects");

    // Load all projects on page load
    db.collection("projects").get().then(snapshot => {
      snapshot.forEach(doc => {
        const p = doc.data();
        showProject(p);
      });
    });

    // Add new project
    form.addEventListener("submit", e => {
      e.preventDefault();
      const project = {
        title: title.value.trim(),
        description: description.value.trim(),
        link: link.value.trim()
      };

      db.collection("projects").add(project)
        .then(() => {
          showProject(project);
          form.reset();
        })
        .catch(err => console.error("Error adding project:", err));
    });

    // Display project
    function showProject(p) {
      const div = document.createElement("div");
      div.className = "project";
      div.innerHTML = `
        <h4>${p.title}</h4>
        <p>${p.description}</p>
        <a href="${p.link}" target="_blank">${p.link}</a>
      `;
      projectsDiv.appendChild(div);
    }
  </script>

</body>
</html>
