<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Dynamic Add</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html" class="active">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <section id="projects" class="section">
    <h2>Projects</h2>

    <!-- Projects container -->
    <div class="projects-container" id="projects-container">
      <!-- Existing project example -->
      <div class="project">
        <h3>Academic AI App</h3>
        <p class="project-date">Completed: 2026</p>
        <p class="project-description">
          Academic AI automates report generation, paraphrasing, and exam prediction for students.
        </p>
        <p><a href="https://merubiochemlabreports.netlify.app" target="_blank" rel="noopener noreferrer">Visit Live Academic AI App</a></p>
      </div>
    </div>

    <hr>

    <!-- Add new project form -->
    <div id="add-project-form" style="margin-top:30px;">
      <h3>Add New Project</h3>
      <label>Project Name: <input type="text" id="proj-name"></label><br><br>
      <label>Date Completed: <input type="text" id="proj-date"></label><br><br>
      <label>Description:<br>
        <textarea id="proj-desc" rows="4" cols="50"></textarea>
      </label><br><br>
      <label>Live Project Link: <input type="text" id="proj-link"></label><br><br>
      <button onclick="addProject()">Add Project</button>
    </div>

  </section>

  <script>
    function addProject() {
      const name = document.getElementById('proj-name').value;
      const date = document.getElementById('proj-date').value;
      const desc = document.getElementById('proj-desc').value;
      const link = document.getElementById('proj-link').value;

      if (!name || !date || !desc || !link) {
        alert("Please fill all fields!");
        return;
      }

      const container = document.getElementById('projects-container');

      const projectDiv = document.createElement('div');
      projectDiv.className = 'project';
      projectDiv.innerHTML = `
        <h3>${name}</h3>
        <p class="project-date">Completed: ${date}</p>
        <p class="project-description">${desc}</p>
        <p><a href="${link}" target="_blank" rel="noopener noreferrer">Visit Live Project</a></p>
      `;

      container.appendChild(projectDiv);

      // Clear form fields
      document.getElementById('proj-name').value = '';
      document.getElementById('proj-date').value = '';
      document.getElementById('proj-desc').value = '';
      document.getElementById('proj-link').value = '';
    }
  </script>

</body>
</html>
